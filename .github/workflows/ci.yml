name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
      # Service is tested down to PHP 7.4; the Api layer (8.4+) and bin/wpal (8.1+) on newer versions.
      - run: vendor/bin/phpunit --order-by=random ${{ matrix.php == '7.4' && '--testsuite unit' || '' }}

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer phpstan -- --no-progress

  wpal:
    name: Service matches WordPress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      # Generated files are current, Service mirrors api/wordpress.json, and wpal.map.php has no mistakes.
      - run: bin/wpal fix --check
      - run: bin/wpal check
      - run: bin/wpal coverage --fail-on-untriaged

  phpcs:
    name: PHP compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpcs

  backward-compatibility:
    name: Backward compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer global require --no-interaction roave/backward-compatibility-check
      - run: "$(composer global config bin-dir --absolute --quiet)/roave-backward-compatibility-check --from=origin/${{ github.base_ref }} --format=github-actions"
